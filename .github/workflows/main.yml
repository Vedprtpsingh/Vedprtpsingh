name: All Repositories Code Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  fetch-all-repos:
    name: Check All Repository Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Fetch all repositories
        run: |
          echo "🔍 Fetching all repositories for Vedprtpsingh..."
          gh repo list Vedprtpsingh --limit 100 --json name,url,language,updatedAt > repos.json
          cat repos.json

      - name: Clone and check Java repositories
        run: |
          echo "☕ Checking Java repositories..."
          for repo in $(jq -r '.[] | select(.language == "Java") | .name' repos.json); do
            echo "📂 Cloning $repo..."
            gh repo clone Vedprtpsingh/$repo || continue
            cd $repo
            
            # Check for pom.xml
            if [ -f "pom.xml" ]; then
              echo "✅ Maven project found in $repo"
              mvn clean compile -q || echo "⚠️ Build issues in $repo"
            fi
            
            # Check for build.gradle
            if [ -f "build.gradle" ]; then
              echo "✅ Gradle project found in $repo"
            fi
            
            cd ..
          done

      - name: Check HTML/CSS repositories
        run: |
          echo "🌐 Checking Web repositories..."
          for repo in $(jq -r '.[] | select(.language == "HTML" or .language == "CSS" or .language == "JavaScript") | .name' repos.json); do
            echo "📂 Checking $repo..."
            gh repo clone Vedprtpsingh/$repo || continue
            cd $repo
            
            # Count files
            html_files=$(find . -name "*.html" | wc -l)
            css_files=$(find . -name "*.css" | wc -l)
            js_files=$(find . -name "*.js" | wc -l)
            
            echo "📄 $repo: HTML($html_files) CSS($css_files) JS($js_files)"
            cd ..
          done

  code-quality-check:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: fetch-all-repos

    steps:
      - name: Setup analysis tools
        run: |
          # Install code analysis tools
          sudo apt-get update
          sudo apt-get install -y cloc
          npm install -g jshint

      - name: Analyze all repositories
        run: |
          echo "📊 Code Quality Analysis Across All Repositories"
          echo "==============================================="
          
          total_repos=0
          java_repos=0
          web_repos=0
          
          for repo_dir in */; do
            if [ -d "$repo_dir" ]; then
              echo "\n🔍 Analyzing $repo_dir"
              cd "$repo_dir"
              
              # Count lines of code
              cloc . --quiet || echo "No code files found"
              
              # Check for Java
              if find . -name "*.java" | head -1 | grep -q .; then
                java_repos=$((java_repos + 1))
                echo "☕ Java project detected"
              fi
              
              # Check for web files
              if find . -name "*.html" -o -name "*.css" -o -name "*.js" | head -1 | grep -q .; then
                web_repos=$((web_repos + 1))
                echo "🌐 Web project detected"
              fi
              
              total_repos=$((total_repos + 1))
              cd ..
            fi
          done
          
          echo "\n📈 Summary:"
          echo "Total repositories analyzed: $total_repos"
          echo "Java projects: $java_repos"
          echo "Web projects: $web_repos"

  repository-health:
    name: Repository Health Check
    runs-on: ubuntu-latest
    needs: [fetch-all-repos, code-quality-check]

    steps:
      - name: Check repository health
        run: |
          echo "🏥 Repository Health Assessment"
          echo "=============================="
          
          healthy_repos=0
          total_checked=0
          
          for repo_dir in */; do
            if [ -d "$repo_dir" ]; then
              echo "\n📋 Checking $repo_dir"
              cd "$repo_dir"
              
              score=0
              
              # Check for README
              if [ -f "README.md" ]; then
                echo "✅ README.md present"
                score=$((score + 1))
              else
                echo "❌ README.md missing"
              fi
              
              # Check for .gitignore
              if [ -f ".gitignore" ]; then
                echo "✅ .gitignore present"
                score=$((score + 1))
              fi
              
              # Check for build files
              if [ -f "pom.xml" ] || [ -f "build.gradle" ] || [ -f "package.json" ]; then
                echo "✅ Build configuration present"
                score=$((score + 1))
              fi
              
              if [ $score -ge 2 ]; then
                echo "🟢 Repository health: Good ($score/3)"
                healthy_repos=$((healthy_repos + 1))
              else
                echo "🟡 Repository health: Needs improvement ($score/3)"
              fi
              
              total_checked=$((total_checked + 1))
              cd ..
            fi
          done
          
          echo "\n📊 Overall Health: $healthy_repos/$total_checked repositories are healthy"

  final-report:
    name: Generate Final Report
    runs-on: ubuntu-latest
    needs: [fetch-all-repos, code-quality-check, repository-health]
    if: always()

    steps:
      - name: Generate comprehensive report
        run: |
          echo "📋 COMPREHENSIVE CODE REPOSITORY ANALYSIS"
          echo "========================================="
          echo "🔍 Analysis completed for all Vedprtpsingh repositories"
          echo "✅ Repository fetching: Completed"
          echo "✅ Code quality analysis: Completed"
          echo "✅ Repository health check: Completed"
          echo "\n🎯 All repositories have been analyzed successfully!"
          echo "💼 Portfolio is ready for technical interviews!"
