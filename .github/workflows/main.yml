name: All Repositories Code Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-repos:
    name: Check all repositories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The built-in token can only read PUBLIC repos of other repositories.
      # For private repos, create a PAT with "repo" scope, save it as a secret
      # named REPOS_TOKEN, and it will be used automatically.
      GH_TOKEN: ${{ secrets.REPOS_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cloc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cloc

      - name: Fetch, build and analyze repositories
        run: |
          set +e -uo pipefail   # keep going when one repo fails

          # NOTE: "language" is not a valid gh field; the correct one is primaryLanguage
          gh repo list Vedprtpsingh --limit 100 --source --no-archived \
            --json name,primaryLanguage,updatedAt > repos.json \
            || { echo "::error::gh repo list failed"; exit 1; }

          jq -r '.[] | "\(.name)\t\(.primaryLanguage.name // "-")"' repos.json > repos.tsv

          mkdir -p work
          : > rows.md
          total=0; java=0; web=0; healthy=0; failed=0

          while IFS=$'\t' read -r -u 3 repo lang; do
            if ! gh repo clone "Vedprtpsingh/$repo" "work/$repo" -- --depth 1 --quiet; then
              echo "::warning::Could not clone $repo"
              continue
            fi
            total=$((total + 1))
            cd "work/$repo"

            # ---- build ----
            build="-"
            if [ -f pom.xml ]; then
              java=$((java + 1))
              if timeout 300 mvn -B -q -DskipTests clean compile > mvn.log 2>&1; then
                build="✅"
              else
                build="⚠️"; failed=$((failed + 1))
                echo "::warning::Maven build failed in $repo"
                echo "---- last lines of $repo build log ----"; tail -n 15 mvn.log
              fi
            elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
              java=$((java + 1)); build="gradle (not built)"
            fi

            # ---- web detection ----
            if [ -f package.json ] || [ -n "$(find . -name '*.html' -not -path './node_modules/*' -print -quit)" ]; then
              web=$((web + 1))
            fi

            # ---- health score ----
            score=0
            readme="❌";  [ -f README.md ]  && { readme="✅"; score=$((score + 1)); }
            gi="❌";      [ -f .gitignore ] && { gi="✅";     score=$((score + 1)); }
            bf="❌"
            if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f package.json ]; then
              bf="✅"; score=$((score + 1))
            fi
            [ "$score" -ge 2 ] && healthy=$((healthy + 1))

            cd "$GITHUB_WORKSPACE"
            printf '| %s | %s | %s | %s | %s | %s | %s/3 |\n' \
              "$repo" "$lang" "$build" "$readme" "$gi" "$bf" "$score" >> rows.md
          done 3< repos.tsv

          {
            echo "## Repository check"
            echo
            echo "Analyzed: **$total** · Java projects: **$java** · Web projects: **$web** · Healthy (2+/3): **$healthy** · Maven build failures: **$failed**"
            echo
            echo "| Repo | Language | Build | README | .gitignore | Build file | Health |"
            echo "|---|---|---|---|---|---|---|"
            cat rows.md
            echo
            echo "### Lines of code"
            echo '```'
            cloc --quiet work
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
